server:
  port: 8085

sa-token:
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:carecloudsa-tokenjwtsecretkey2026}

spring:
  application:
    name: care-mq-service
  profiles:
    active: mq
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:localhost:8848}
        prefix: care
        file-extension: yml
        namespace: bbaaab7c-134c-4044-bf60-64459651fe92
      discovery:
        server-addr: ${NACOS_CONFIG_ADDR:localhost:8848}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:123456789}
